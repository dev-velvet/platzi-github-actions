name: triggers
run-name: ¡Estoy aprendiendo sobre distintos triggers!

on:
  push:
    branches:
      - aprendiendo-github-actions
  
  pull_request:
    branches:
      - aprendiendo-github-actions

  issues:
    types: [opened, edited, closed]
  
  issue_comment:
    types: [created, edited, deleted]

  workflow_dispatch:
    inputs:
      nombre:
        description: 'Escribe tu nombre'
        required: true
        default: 'Platzi'
  
  schedule:
    -cron: '10 3, 18, * * *'

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar despliegue
        run: echo "Iniciando despliegue manual..."
