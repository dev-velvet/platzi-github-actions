name: hola-mundo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ejecutar-script:
    name: Print Hola Mundo
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Print Hola Mundo
        run: python python_script.py